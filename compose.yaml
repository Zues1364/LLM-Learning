services:
  mcp:
    build: .
    command: ["python", "-m", "uvicorn", "src.mcp_server.server:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      MCP_SERVER_URL: http://mcp:8000
      APP_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  backend:
    build: .
    command: ["python", "-m", "uvicorn", "app:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "9000"]
    env_file:
      - .env
    environment:
      MCP_SERVER_URL: http://mcp:8000
      APP_DATA_DIR: /app/data
      CORS_ALLOW_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      - mcp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
